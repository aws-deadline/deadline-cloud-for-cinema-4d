specificationVersion: 'jobtemplate-2023-09'
extensions:
  - TASK_CHUNKING
name: Default Cinema4D Job Template
description: Default Cinema4D Job Description
parameterDefinitions:
- name: Cinema4DFile
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface:
    control: CHOOSE_INPUT_FILE
    label: Cinema4D Document File
    groupLabel: Cinema4D Settings
    fileFilters:
    - label: Cinema4D document files
      patterns:
      - '*.c4d'
    - label: All Files
      patterns:
      - '*'
  description: The Cinema4D document file to render.
- name: Frames
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Frames
    groupLabel: Cinema4D Settings
  description: The frames to render. E.g. 1-3,8,11-15
  minLength: 1
- name: ChunkSize
  type: INT
  default: 1
  minValue: 1
  description: >
    Number of frames per chunk. Use 1 for one frame per task (default).
    Higher values group frames into chunks to reduce per-task overhead.
  userInterface:
    control: SPIN_BOX
    label: Frames Per Chunk
    groupLabel: Cinema4D Settings
- name: TargetChunkDuration
  type: INT
  default: 0
  minValue: 0
  description: >
    Target render time per chunk in seconds. Deadline Cloud will automatically
    adjust how many frames are grouped together to hit this target.
    Set to 0 to always use the fixed frames-per-chunk value.
  userInterface:
    control: SPIN_BOX
    label: Target Chunk Duration (Seconds)
    groupLabel: Cinema4D Settings
steps:
- name: RenderCommand
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: CHUNK[INT]
      range: "{{Param.Frames}}"
      chunks:
        defaultTaskCount: '{{Param.ChunkSize}}'
        targetRuntimeSeconds: '{{Param.TargetChunkDuration}}'
        rangeConstraint: CONTIGUOUS
  stepEnvironments:
  - name: Cinema4D
    variables:
      TAKE: ""
      OUTPUT_PATH: ""
  script:
    actions:
      onRun:
        command: '{{Task.File.Run}}'
    embeddedFiles:
      - name: Run
        runnable: true
        type: TEXT
        data: |
          #!/usr/bin/env bash

          set -xeuo pipefail

          START_FRAME="$(echo '{{Task.Param.Frame}}' | cut -d- -f1)"
          END_FRAME="$(echo '{{Task.Param.Frame}}' | cut -d- -f2)"

          Commandline -nogui -render "{{Param.Cinema4DFile}}" \
            -take "${TAKE}" \
            -frame "${START_FRAME}" "${END_FRAME}"
