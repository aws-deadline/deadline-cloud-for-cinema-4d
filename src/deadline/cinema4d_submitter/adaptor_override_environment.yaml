specificationVersion: 'jobtemplate-2023-09'
parameterDefinitions:
- name: OverrideAdaptorWheels
  type: PATH
  objectType: DIRECTORY
  dataFlow: IN
  description: A directory that contains wheels for openjd, deadline, and the overridden adaptor.
- name: OverrideAdaptorName
  type: STRING
  description: The name of the adaptor to override, for example cinema4d-openjd.
environment:
  name: OverrideAdaptor
  description: >
    Replaces the default Adaptor in the environment's PATH with one from the
    packages in the OverrideAdaptorWheels attached directory.
  script:
    actions:
      onEnter:
        # The Cinema 4D Conda environment provides "python" on Windows and Linux.
        command: python
        args:
        - '{{Env.File.SetupAdaptor}}'
        - '{{Session.WorkingDirectory}}'
        - '{{Param.OverrideAdaptorWheels}}'
        - '{{Param.OverrideAdaptorName}}'
        cancelation:
          mode: NOTIFY_THEN_TERMINATE
    embeddedFiles:
    - name: SetupAdaptor
      filename: setup-adaptor.py
      type: TEXT
      runnable: true
      data: |
        # Replaced with setup_adaptor_wheels.py while building the job template.
        pass
