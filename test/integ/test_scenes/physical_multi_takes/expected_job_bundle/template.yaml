steps:
- name: Main
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: CHUNK[INT]
      range: '{{Param.MainFrames}}'
      chunks:
        defaultTaskCount: '{{Param.ChunkSize}}'
        targetRuntimeSeconds: '{{Param.TargetChunkDuration}}'
        rangeConstraint: CONTIGUOUS
  stepEnvironments:
  - name: Cinema4D
    description: Runs Cinema4D in the background.
    variables:
      PYTHONUNBUFFERED: '1'
      SUBMITTER_INTEGRATION_VERSION: '{{Param.SubmitterIntegrationVersion}}'
    script:
      embeddedFiles:
      - name: initData
        filename: init-data.yaml
        type: TEXT
        data: |
          take: Main
          activate_error_checking: '{{Param.ActivateErrorChecking}}'
          use_cached_text: '{{Param.UseCachedText}}'
          scene_file: {{Param.Cinema4DFile}}
          output_path: PATH_TO_BE_REPLACED\\deadline-cloud-for-cinema-4d\test\integ\test_scenes\physical_multi_takes\generated_bundle\renders\physical_multi_takes_Main
          multi_pass_path: ''
      actions:
        onEnter:
          command: cinema4d-openjd
          args:
          - daemon
          - start
          - --path-mapping-rules
          - file://{{Session.PathMappingRulesFile}}
          - --connection-file
          - '{{Session.WorkingDirectory}}/connection.json'
          - --init-data
          - file://{{Env.File.initData}}
          cancelation:
            mode: NOTIFY_THEN_TERMINATE
          timeout: 600
        onExit:
          command: cinema4d-openjd
          args:
          - daemon
          - stop
          - --connection-file
          - '{{ Session.WorkingDirectory }}/connection.json'
          cancelation:
            mode: NOTIFY_THEN_TERMINATE
          timeout: 300
  script:
    embeddedFiles:
    - name: runData
      filename: run-data.yaml
      type: TEXT
      data: |
        frame: '{{Task.Param.Frame}}'
    actions:
      onRun:
        command: cinema4d-openjd
        args:
        - daemon
        - run
        - --connection-file
        - '{{ Session.WorkingDirectory }}/connection.json'
        - --run-data
        - file://{{ Task.File.runData }}
        cancelation:
          mode: NOTIFY_THEN_TERMINATE
        timeout: 172800
