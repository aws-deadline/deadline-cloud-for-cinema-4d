name: "Build Installers"

on:
  workflow_dispatch:
    inputs:
      os:
        required: true
        default: Windows
        type: choice
        options:
        - MacOS
        - Windows
      ref_type:
        required: true
        default: heads
        type: choice
        options:
        - tags
        - heads
      ref:
        required: true
        type: string
        default: mainline
      environment:
        required: true
        type: choice
        options:
        - mainline

jobs:
  BuildInstaller:
    if: (github.repository == 'aws-deadline/deadline-cloud-for-cinema-4d')
    name: Build Installer
    uses: aws-deadline/.github/.github/workflows/reusable_build_installers.yml@mainline
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      environment: ${{inputs.environment}}
      ref_type: ${{inputs.ref_type}}
      ref: ${{inputs.ref}}
      oses: "['${{inputs.os}}']"
      project_name: "deadline-cloud-for-cinema-4d"

