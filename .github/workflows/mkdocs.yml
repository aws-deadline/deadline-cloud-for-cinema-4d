name: Build and Deploy MkDocs

on:
  push:
    branches:
      - mainline
    paths:
      - 'docs/user_guide/**'
      - 'mkdocs.yml'
      - '.github/workflows/mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install mkdocs-material

      - name: Build and deploy documentation
        run: |
          # Set dynamic site URL for the current repository
          REPO_NAME=$(echo ${{ github.repository }} | cut -d'/' -f2)
          sed -i "s|{{ github.repository_owner }}|${{ github.repository_owner }}|g" mkdocs.yml
          sed -i "s|{{ github.event.repository.name }}|${REPO_NAME}|g" mkdocs.yml
          sed -i "s|{{ github.repository }}|${{ github.repository }}|g" mkdocs.yml
          mkdocs gh-deploy --force