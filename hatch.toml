[envs.default]
# The unit tests exercise the submitter, which resolves through the gui extra -- that is
# where the console extra and awscrt are declared, so the console sign-in dependency
# tests need them present.
features = ["gui"]
pre-install-commands = [
  "pip install -r requirements-testing.txt"
]

[envs.default.scripts]
sync = "pip install -r requirements-testing.txt"
test = "pytest {args:test/unit}  -vvv"
test-installer = "pytest --no-cov {args:test/installer} -vvv"
typing = "mypy {args:src test}"
style = [
  "ruff check {args:.}",
  "black --check --diff {args:.}",
]
fmt = [
  "black {args:.}",
  "style",
]
lint = [
  "style",
  "typing",
]

[[envs.all.matrix]]
python = ["3.10", "3.11", "3.12", "3.13"]

[envs.release]
detached = true

[envs.release.scripts]
deps = "pip install -r requirements-release.txt"
bump = "semantic-release -v --strict version --no-push --no-commit --no-tag --skip-build {args}"
version = "semantic-release -v --strict version --print {args}"

# Drives the real Deadline Cloud submitter dialog end-to-end with xa11y.
[envs.integ]
python = "3.11"
pre-install-commands = [
  "pip install -r requirements-testing.txt"
]

[envs.integ.env-vars]
PYTHONIOENCODING = "utf-8"

[envs.integ.scripts]
test = "pytest --no-cov {args:test/integ} -vvv --numprocesses=1"

[envs.installer.scripts]
build-installer = "python {root}/scripts/build_installer_cli.py --installer-source-path {root}/installer/DeadlineCloudForCinema4dSubmitter.xml {args:}"
